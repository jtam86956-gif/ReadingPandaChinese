# 每日内容流水线：抓取 → 中文 NLP 加工 → 写 manifest.json → 重建 catalog → 提交
# 对应 PRD M0 / TECH-STACK §7。
name: daily-content

on:
  schedule:
    # 每天 UTC 02:00（北京时间 10:00）跑一次
    - cron: "0 2 * * *"
  workflow_dispatch: {}   # 允许手动触发，便于调试

permissions:
  contents: write          # 允许提交产物回本仓库

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: python -m pipeline.pipeline run-today --limit 5
        env:
          TZ: Asia/Shanghai

      - name: Commit & push content
        run: |
          git config user.name  "panda-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add content/
          # 仅在有变更时提交，避免空提交失败
          if ! git diff --cached --quiet; then
            git commit -m "content: daily update $(date -I)"
            git push
          else
            echo "No content changes today."
          fi
